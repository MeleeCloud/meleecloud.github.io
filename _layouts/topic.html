---
layout: default
---

{% assign parent_entry = site.entries
  | where: "entry_id", page.entry
  | first
%}

<article class="topic-page">
  {% if parent_entry %}
    <p class="topic-parent">
      <a href="{{ parent_entry.url | relative_url }}">
        ← {{ parent_entry.title }}
      </a>
    </p>
  {% endif %}

  <header>
    <h1>{{ page.title }}</h1>

    {% if page.summary %}
      <p>{{ page.summary }}</p>
    {% endif %}
  </header>

  {{ content }}
</article>
