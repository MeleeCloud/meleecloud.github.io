name: Create missing entry files

on:
  push:
    branches:
      - main
    paths:
      - "_data/library.yml"
      - "templates/entry-template.md"
      - ".github/scripts/sync_entries.rb"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-entries:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Create missing entry files
        run: ruby .github/scripts/sync_entries.rb

      - name: Commit created files
        run: |
          if git diff --quiet -- _entries; then
            echo "No new entry files were created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _entries
          git commit -m "Create missing library entry files"
          git push
